[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "werender"
version = "0.2.0b0"
description = "Zero-Config Peer-to-Peer Distributed Render Manager for Blender"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["blender", "render", "distributed", "render-farm", "network-rendering"]
authors = [
    { name = "WeRender Team", email = "team@werender.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "zeroconf>=0.131.0",
    "psutil>=5.9.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "aiofiles>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/toxzak-svg/werender"
Documentation = "https://github.com/toxzak-svg/werender#readme"
Repository = "https://github.com/toxzak-svg/werender"
Issues = "https://github.com/toxzak-svg/werender/issues"
Changelog = "https://github.com/toxzak-svg/werender/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
werender = "werender.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/werender"]
artifacts = ["src/werender/dashboard/**"]

[tool.hatch.build.targets.sdist]
include = ["src/werender/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]