[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "werender"
version = "0.1.0"
description = "Zero-Config Peer-to-Peer Distributed Render Manager for Blender"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["blender", "render", "distributed", "render-farm"]
authors = [
    { name = "WeRender Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "zeroconf>=0.131.0",
    "psutil>=5.9.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
werender = "werender.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/werender"]

[tool.hatch.build.targets.sdist]
include = ["src/werender"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
